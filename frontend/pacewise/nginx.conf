log_format pacewise_safe '$request_method $uri $status $request_time';
server {
    listen 80;
    server_name _;
    client_max_body_size 250m;
    charset utf-8;
    resolver 127.0.0.11 valid=5s ipv6=off;
    set $pacewise_backend http://backend:8000;
    access_log /var/log/nginx/access.log pacewise_safe;
    add_header Referrer-Policy "no-referrer" always;

    location = /api/v1/lms/events/stream {
        proxy_pass $pacewise_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_read_timeout 1h;
        add_header X-Accel-Buffering no;
    }

    location = /api/v1/chat/stream {
        proxy_pass $pacewise_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_read_timeout 5m;
        add_header Cache-Control "no-store, no-transform" always;
        add_header X-Accel-Buffering no;
    }

    location /api/ {
        proxy_pass $pacewise_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # Marketing landing page and the React app share the same origin/port.
    location = /pacewise-sw.js {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-store";
        try_files $uri =404;
    }
    location = / {
        root /usr/share/nginx/html;
        try_files /PaceWise.html =404;
    }

    location = /app {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-store" always;
        add_header Referrer-Policy "no-referrer" always;
        try_files /index.html =404;
    }

    # The HTML entry point must discover the new hashed bundle after deploy.
    # This also covers the internal redirect used by SPA fallback routes.
    location = /index.html {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-store" always;
        add_header Referrer-Policy "no-referrer" always;
        try_files /index.html =404;
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
}
